<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <h1>Guess the Number</h1>
    <div id="box">
      <div>Guess a number between 1 and 100!</div>
      <input type="text" id="Number" placeholder="No btw 1 to 100" />
      <div>You have 10 attempt to guess the number</div>
      <div id="submit">
        <button>Submit</button>
      </div>

      <div id="Previous">
        Previous Guess :
        <div id="Prev"></div>
      </div>
      <div>
        Guess Remaining :
        <div id="Remain"></div>
      </div>
    </div>
    <div id="result"></div>
  </body>
  <script src="script.js"></script>
</html>
